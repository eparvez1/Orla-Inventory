<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111827">
<title>Sales God Mode</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:800}.sub{font-size:12px;color:#cbd5e1;margin-top:3px}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:69px;z-index:4}
nav button{border:0;background:#eef2ff;padding:9px 12px;border-radius:10px;white-space:nowrap;font-weight:700;color:#374151}
nav button.active{background:#111827;color:#fff}
main{max-width:1200px;margin:auto;padding:14px}.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000008}.metric{font-size:24px;font-weight:850;margin-top:6px}.muted{color:#6b7280;font-size:12px}.positive{color:#047857}.negative{color:#b91c1c}
h2{margin:8px 0 14px;font-size:20px}.section{margin-top:18px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;color:#4b5563}input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;margin-top:4px;background:#fff}button.primary{background:#111827;color:#fff;border:0;padding:10px 14px;border-radius:9px;font-weight:800}
button.danger{background:#fee2e2;color:#991b1b;border:0;padding:7px 9px;border-radius:8px;font-weight:700}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f9fafb}
.tablewrap{overflow:auto}.empty{padding:30px;text-align:center;color:#6b7280}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.alert{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:8px}
.small{font-size:11px}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef2ff;font-size:11px;font-weight:700}
</style>
</head>
<body>
<header><div class="brand">SALES GOD MODE</div><div class="sub">Offline Retail • Inventory • Sales • Profit</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const KEY="sales_god_mode_v1";
const seed={brands:[],categories:[],products:[],stock:[],purchases:[],purchaseItems:[],saleAllocations:[],sales:[],saleItems:[],expenses:[],returns:[],audit:[],settings:{currency:"৳"}};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||seed;
db.returns=db.returns||[]; db.expenses=db.expenses||[]; db.stock=db.stock||[]; db.sales=db.sales||[]; db.saleItems=db.saleItems||[]; db.purchases=db.purchases||[]; db.purchaseItems=db.purchaseItems||[]; db.saleAllocations=db.saleAllocations||[]; db.audit=db.audit||[];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function audit(action,entity,details){db.audit.push({id:id(),action,entity,details,date:new Date().toISOString()})}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return (Number(n)||0).toLocaleString("en-BD",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+db.settings.currency}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function brandName(x){return db.brands.find(b=>b.id===x)?.name||"—"}
function catName(x){return db.categories.find(c=>c.id===x)?.name||"—"}
function productName(x){return db.products.find(p=>p.id===x)?.name||"—"}
function stockOf(pid){return db.stock.filter(x=>x.productId===pid).reduce((a,x)=>a+Number(x.qty||0),0)}
function productCost(pid){
let p=db.products.find(x=>x.id===pid);
let batches=db.purchaseItems.filter(x=>x.productId===pid&&Number(x.remaining)>0);
if(!batches.length)return Number(p?.cost||0);
let q=batches.reduce((a,x)=>a+Number(x.remaining),0);
return q?batches.reduce((a,x)=>a+Number(x.remaining)*Number(x.unitCost),0)/q:Number(p?.cost||0);
}
function todayISO(){return new Date().toISOString().slice(0,10)}
function todaySales(){return db.sales.filter(s=>s.date.slice(0,10)===todayISO())}
function returnedAmountForSale(sid){return db.returns.filter(r=>r.saleId===sid).reduce((a,r)=>a+Number(r.amount||0),0)}
function revenue(sales=db.sales){return sales.reduce((a,s)=>a+Number(s.total||0)-returnedAmountForSale(s.id),0)}
function cogs(sales=db.sales){return sales.reduce((a,s)=>a+db.saleItems.filter(i=>i.saleId===s.id).reduce((z,i)=>{let returned=db.returns.filter(r=>r.saleItemId===i.id).reduce((q,r)=>q+Number(r.qty||0),0);return z+Number(i.cost||0)*Math.max(0,Number(i.qty||0)-returned)},0),0)}
function gross(sales=db.sales){return revenue(sales)-cogs(sales)}
function expensesTotal(){return db.expenses.reduce((a,e)=>a+Number(e.amount||0),0)}
function btn(t,fn,cls=""){return `<button class="${cls}" onclick="${fn}">${t}</button>`}
const views=[
["dashboard","Dashboard"],["sale","Retail Sale"],["products","Products"],["brands","Brands"],["categories","Categories"],
["stockin","Stock In"],["stockout","Stock Out"],["purchases","Purchases"],["sales","Sales"],["returns","Returns"],["expenses","Expenses"],["reports","Reports"],["audit","Audit Log"],["backup","Backup"],["settings","Settings"]
];
function nav(){
document.getElementById("nav").innerHTML=views.map(v=>`<button data-v="${v[0]}" onclick="show('${v[0]}')">${v[1]}</button>`).join("");
}
function show(v){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
document.getElementById("app").innerHTML=({dashboard,sale,products,brands,categories,stockin,stockout,purchases,sales,returns,expenses,reports,audit,backup,settings})[v](); if(v==="products")renderProductTable(); if(v==="sales")renderSalesTable();
}
function dashboard(){
let ts=todaySales(), low=db.products.filter(p=>stockOf(p.id)<=Number(p.min||0));
return `<h2>Dashboard</h2>
<div class="grid">
<div class="card"><div class="muted">Today's Sales</div><div class="metric">${money(revenue(ts))}</div></div>
<div class="card"><div class="muted">Today's Gross Profit</div><div class="metric positive">${money(gross(ts))}</div></div>
<div class="card"><div class="muted">Total Sales</div><div class="metric">${money(revenue())}</div></div>
<div class="card"><div class="muted">Gross Profit</div><div class="metric positive">${money(gross())}</div></div>
<div class="card"><div class="muted">Expenses</div><div class="metric negative">${money(expensesTotal())}</div></div>
<div class="card"><div class="muted">Net Profit</div><div class="metric positive">${money(gross()-expensesTotal())}</div></div>
<div class="card"><div class="muted">Products</div><div class="metric">${db.products.length}</div></div>
<div class="card"><div class="muted">Units In Stock</div><div class="metric">${db.products.reduce((a,p)=>a+stockOf(p.id),0)}</div></div><div class="card"><div class="muted">Current Stock Cost Value</div><div class="metric">${money(db.products.reduce((a,p)=>a+stockOf(p.id)*productCost(p.id),0))}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric negative">${money(expensesTotal())}</div></div>
</div>
<div class="section"><h2>Low Stock</h2>${low.length?low.map(p=>`<div class="alert"><b>${esc(p.name)}</b> • ${esc(brandName(p.brandId))} • ${stockOf(p.id)} pcs remaining</div>`).join(""):'<div class="card">No low-stock products.</div>'}</div>
<div class="section"><h2>Brand Performance</h2><div class="tablewrap"><table><tr><th>Brand</th><th>Sales</th><th>Cost</th><th>Gross Profit</th></tr>${db.brands.map(b=>{let ss=db.sales.filter(s=>db.saleItems.some(i=>i.saleId===s.id&&db.products.find(p=>p.id===i.productId)?.brandId===b.id));return `<tr><td>${esc(b.name)}</td><td>${money(revenue(ss))}</td><td>${money(cogs(ss))}</td><td class="positive">${money(gross(ss))}</td></tr>`}).join("")||'<tr><td colspan="4" class="empty">Add brands and sales to see performance.</td></tr>'}</table></div></div>`;
}
function brands(){
return `<h2>Brands</h2><form onsubmit="addBrand(event)"><div><label>Brand name</label><input id="brandName" required placeholder="US Polo"></div><div style="align-self:end">${btn("Add Brand","this.form.requestSubmit()","primary")}</div></form>
<div class="section tablewrap"><table><tr><th>Brand</th><th>Products</th><th>Action</th></tr>${db.brands.map(b=>`<tr><td>${esc(b.name)}</td><td>${db.products.filter(p=>p.brandId===b.id).length}</td><td>${btn("Delete",`delBrand('${b.id}')`,"danger")}</td></tr>`).join("")||'<tr><td colspan="3" class="empty">No brands yet.</td></tr>'}</table></div>`;
}
function addBrand(e){e.preventDefault();let n=brandName.value.trim();if(!n)return;if(db.brands.some(b=>b.name.toLowerCase()===n.toLowerCase()))return alert("Brand already exists.");db.brands.push({id:id(),name:n});audit("CREATE","BRAND",n);save();show("brands")}
function delBrand(x){if(db.products.some(p=>p.brandId===x))return alert("Cannot delete: products use this brand.");db.brands=db.brands.filter(b=>b.id!==x);save();show("brands")}
function categories(){
return `<h2>Categories</h2><form onsubmit="addCat(event)"><div><label>Category name</label><input id="catName" required placeholder="Polo Shirt"></div><div style="align-self:end">${btn("Add Category","this.form.requestSubmit()","primary")}</div></form>
<div class="section tablewrap"><table><tr><th>Category</th><th>Products</th><th>Action</th></tr>${db.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${db.products.filter(p=>p.categoryId===c.id).length}</td><td>${btn("Delete",`delCat('${c.id}')`,"danger")}</td></tr>`).join("")||'<tr><td colspan="3" class="empty">No categories yet.</td></tr>'}</table></div>`;
}
function addCat(e){e.preventDefault();let n=catName.value.trim();if(!n)return;if(db.categories.some(c=>c.name.toLowerCase()===n.toLowerCase()))return alert("Category already exists.");db.categories.push({id:id(),name:n});audit("CREATE","CATEGORY",n);save();show("categories")}
function delCat(x){if(db.products.some(p=>p.categoryId===x))return alert("Cannot delete: products use this category.");db.categories=db.categories.filter(c=>c.id!==x);save();show("categories")}
function products(){
return `<h2>Products</h2>
<div class="toolbar"><input id="productSearch" placeholder="Search name / SKU / brand / category" oninput="renderProductTable()" style="flex:1;min-width:220px"></div>
<form onsubmit="addProduct(event)">
<div><label>Product name</label><input id="pn" required placeholder="US Polo Premium Polo"></div>
<div><label>Brand</label><select id="pb" required>${db.brands.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select></div>
<div><label>Category</label><select id="pc" required>${db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
<div><label>SKU</label><input id="psku" required placeholder="USP-001"></div>
<div><label>Size</label><input id="psz" placeholder="M / L / XL"></div>
<div><label>Color</label><input id="pcolor" placeholder="Black"></div>
<div><label>Purchase cost</label><input id="pcost" type="number" step="0.01" min="0" required></div>
<div><label>Retail price</label><input id="pretail" type="number" step="0.01" min="0" required></div>
<div><label>Sale price</label><input id="psale" type="number" step="0.01" min="0" required></div>
<div><label>Minimum stock</label><input id="pmin" type="number" min="0" value="3"></div>
<div style="align-self:end">${btn("Add Product","this.form.requestSubmit()","primary")}</div></form>
<div class="section tablewrap" id="productTable"></div>`;
}
function renderProductTable(){
let q=(document.getElementById("productSearch")?.value||"").toLowerCase().trim();
let rows=db.products.filter(p=>(p.name+" "+p.sku+" "+brandName(p.brandId)+" "+catName(p.categoryId)+" "+p.size+" "+p.color).toLowerCase().includes(q));
document.getElementById("productTable").innerHTML=`<table><tr><th>Product</th><th>Brand</th><th>SKU</th><th>Cost</th><th>Retail</th><th>Sale</th><th>Stock</th><th></th></tr>${rows.map(p=>`<tr><td>${esc(p.name)}<div class="small muted">${esc(p.size)} ${esc(p.color)}</div></td><td>${esc(brandName(p.brandId))}</td><td>${esc(p.sku)}</td><td>${money(p.cost)}</td><td>${money(p.retail)}</td><td>${money(p.sale)}</td><td><b>${stockOf(p.id)}</b></td><td>${btn("Delete",`delProduct('${p.id}')`,"danger")}</td></tr>`).join("")||'<tr><td colspan="8" class="empty">No matching products.</td></tr>'}</table>`;
}
function addProduct(e){e.preventDefault();if(!db.brands.length||!db.categories.length)return alert("Add at least one brand and category first.");let sku=psku.value.trim();if(db.products.some(p=>p.sku.toLowerCase()===sku.toLowerCase()))return alert("SKU already exists.");let np={id:id(),name:pn.value.trim(),brandId:pb.value,categoryId:pc.value,sku,size:psz.value.trim(),color:pcolor.value.trim(),cost:Number(pcost.value),retail:Number(pretail.value),sale:Number(psale.value),min:Number(pmin.value||0)};db.products.push(np);audit("CREATE","PRODUCT",np.name+" / "+np.sku);save();show("products")}
function delProduct(x){if(stockOf(x)!==0||db.saleItems.some(i=>i.productId===x))return alert("Cannot delete a product with stock or sales history.");db.products=db.products.filter(p=>p.id!==x);save();show("products")}
function stockForm(type){
return `<h2>${type==="in"?"Stock In":"Stock Out"}</h2><form onsubmit="addStock(event,'${type}')">
<div><label>Product</label><select id="sp" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.sku)} • stock ${stockOf(p.id)}</option>`).join("")}</select></div>
<div><label>Quantity</label><input id="sq" type="number" min="1" required></div>
<div><label>Unit cost</label><input id="sc" type="number" step="0.01" min="0" value="${db.products[0]?.cost||0}"></div>
<div><label>Reason / Reference</label><input id="sr" placeholder="${type==="in"?"Supplier invoice / purchase":"Damaged / lost / adjustment"}"></div>
<div style="align-self:end">${btn(type==="in"?"Receive Stock":"Remove Stock","this.form.requestSubmit()","primary")}</div></form>
<div class="section tablewrap"><table><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>Cost</th><th>Reason</th></tr>${db.stock.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(productName(x.productId))}</td><td><span class="pill">${x.type}</span></td><td>${x.qty}</td><td>${money(x.unitCost)}</td><td>${esc(x.reason||"")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">No stock movements.</td></tr>'}</table></div>`;
}
function stockin(){return stockForm("in")}
function stockout(){return stockForm("out")}
function addStock(e,type){e.preventDefault();let pid=sp.value,q=Number(sq.value),qty=type==="in"?q:-q;if(type==="out"&&q>stockOf(pid))return alert("Not enough stock.");db.stock.push({id:id(),productId:pid,type:type==="in"?"STOCK_IN":"STOCK_OUT",qty,unitCost:Number(sc.value||productCost(pid)),reason:sr.value.trim(),date:new Date().toISOString()});audit(type==="in"?"STOCK_IN":"STOCK_OUT","STOCK",productName(pid)+" × "+q);save();show(type==="in"?"stockin":"stockout")}
function sale(){
let opts=db.products.map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.sku)} • ${money(p.sale)} • stock ${stockOf(p.id)}</option>`).join("");
return `<h2>Retail Sale</h2><div class="card"><form onsubmit="makeSale(event)">
<div class="full"><label>Product</label><select id="saleProduct" required>${opts}</select></div>
<div><label>Quantity</label><input id="saleQty" type="number" min="1" value="1" required></div>
<div><label>Unit selling price</label><input id="salePrice" type="number" step="0.01" min="0" required></div>
<div><label>Discount</label><input id="saleDisc" type="number" step="0.01" min="0" value="0"></div>
<div><label>Payment</label><select id="pay"><option>Cash</option><option>bKash</option><option>Nagad</option><option>Card</option><option>Other</option></select></div>
<div><label>Customer / Note</label><input id="saleNote" placeholder="Optional"></div>
<div style="align-self:end">${btn("Complete Sale","this.form.requestSubmit()","primary")}</div></form></div>`;
}
document.addEventListener("change",e=>{if(e.target.id==="saleProduct"){let p=db.products.find(x=>x.id===e.target.value);if(p)salePrice.value=p.sale}})
function makeSale(e){e.preventDefault();let pid=saleProduct.value,q=Number(saleQty.value),p=db.products.find(x=>x.id===pid);if(!p)return;if(q>stockOf(pid))return alert("Not enough stock.");let unit=Number(salePrice.value),disc=Number(saleDisc.value||0),sub=q*unit,total=Math.max(0,sub-disc),s={id:id(),invoice:"INV-"+Date.now(),date:new Date().toISOString(),subtotal:sub,discount:disc,total,payment:pay.value,note:saleNote.value};db.sales.push(s);let remaining=q, allocatedCost=0;
let batches=db.purchaseItems.filter(x=>x.productId===pid&&Number(x.remaining)>0).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
for(let b of batches){
 if(remaining<=0)break;
 let take=Math.min(remaining,Number(b.remaining));
 db.saleAllocations.push({id:id(),saleId:s.id,saleItemId:null,purchaseItemId:b.id,productId:pid,qty:take,unitCost:Number(b.unitCost)});
 b.remaining-=take; remaining-=take; allocatedCost+=take*Number(b.unitCost);
}
let avgCost=q?allocatedCost/q:productCost(pid);
let si={id:id(),saleId:s.id,productId:pid,qty:q,unitPrice:unit,cost:avgCost,total};
db.saleItems.push(si);
db.saleAllocations.filter(a=>a.saleId===s.id&&a.saleItemId===null).forEach(a=>a.saleItemId=si.id);
db.stock.push({id:id(),productId:pid,type:"SALE",qty:-q,unitCost:avgCost,reason:s.invoice,date:s.date});audit("CREATE","SALE",s.invoice+" / "+money(s.total));save();alert("Sale completed: "+s.invoice);show("sale")}

function purchases(){
return `<h2>Purchase Batches</h2>
<div class="card"><form onsubmit="addPurchase(event)">
<div><label>Product</label><select id="buyProduct" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.sku)}</option>`).join("")}</select></div>
<div><label>Quantity</label><input id="buyQty" type="number" min="1" required></div>
<div><label>Unit Cost</label><input id="buyCost" type="number" min="0" step="0.01" required></div>
<div><label>Supplier / Reference</label><input id="buyRef" placeholder="Supplier invoice"></div>
<div><label>Date</label><input id="buyDate" type="date" value="${todayISO()}" required></div>
<div style="align-self:end">${btn("Add Purchase Batch","this.form.requestSubmit()","primary")}</div>
</form></div>
<div class="section tablewrap"><table><tr><th>Date</th><th>Product</th><th>Qty</th><th>Unit Cost</th><th>Remaining</th><th>Reference</th></tr>
${db.purchaseItems.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(productName(x.productId))}</td><td>${x.qty}</td><td>${money(x.unitCost)}</td><td><b>${x.remaining}</b></td><td>${esc(x.reference||"")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">No purchase batches yet.</td></tr>'}</table></div>`;
}
function addPurchase(e){
e.preventDefault();
let pid=buyProduct.value,q=Number(buyQty.value),cost=Number(buyCost.value),date=buyDate.value;
let pur={id:id(),reference:buyRef.value.trim(),date};
db.purchases.push(pur); audit("CREATE","PURCHASE",pur.reference||"Purchase batch");
db.purchaseItems.push({id:id(),purchaseId:pur.id,productId:pid,qty:q,remaining:q,unitCost:cost,reference:pur.reference,date});
db.stock.push({id:id(),productId:pid,type:"STOCK_IN",qty:q,unitCost:cost,reason:pur.reference||"Purchase",date:new Date(date+"T12:00:00").toISOString()});
let prod=db.products.find(x=>x.id===pid); if(prod)prod.cost=cost;
save();show("purchases");
}
function sales(){
return `<h2>Sales History</h2>
<div class="toolbar"><input id="salesSearch" placeholder="Search invoice / product / payment" oninput="renderSalesTable()" style="flex:1;min-width:220px">${btn("Export Sales CSV","exportSalesCSV()","primary")}${btn("Print Sales Report","printSalesReport()","primary")}</div>
<div class="tablewrap" id="salesTable"></div>`;
}
function renderSalesTable(){
let q=(document.getElementById("salesSearch")?.value||"").toLowerCase().trim();
let rows=db.sales.slice().reverse().filter(s=>{
let its=db.saleItems.filter(i=>i.saleId===s.id);
let text=s.invoice+" "+s.payment+" "+its.map(i=>productName(i.productId)).join(" ");
return text.toLowerCase().includes(q);
});
document.getElementById("salesTable").innerHTML=`<table><tr><th>Invoice</th><th>Date</th><th>Items</th><th>Total</th><th>Cost</th><th>Profit</th><th>Payment</th><th></th></tr>${rows.map(s=>{let its=db.saleItems.filter(i=>i.saleId===s.id),cc=cogs([s]);return `<tr><td>${esc(s.invoice)}</td><td>${esc(s.date.slice(0,16).replace("T"," "))}</td><td>${its.map(i=>productName(i.productId)+" × "+i.qty).join("<br>")}</td><td>${money(revenue([s]))}</td><td>${money(cc)}</td><td class="positive">${money(gross([s]))}</td><td>${esc(s.payment)}</td><td>${btn("Invoice",`printInvoice('${s.id}')`,"primary")}</td></tr>`}).join("")||'<tr><td colspan="7" class="empty">No matching sales.</td></tr>'}</table>`;
}
function csvEscape(x){return '"'+String(x??"").replace(/"/g,'""')+'"'}
function downloadCSV(filename,rows){
let csv=rows.map(r=>r.map(csvEscape).join(",")).join("\n");
let blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)
}

function printInvoice(sid){
let s=db.sales.find(x=>x.id===sid); if(!s)return;
let its=db.saleItems.filter(i=>i.saleId===sid);
let returned=its.map(i=>({i,r:db.returns.filter(x=>x.saleItemId===i.id).reduce((a,x)=>a+Number(x.qty),0)}));
let rows=returned.map(x=>{let q=Math.max(0,Number(x.i.qty)-x.r);return `<tr><td>${esc(productName(x.i.productId))}</td><td>${q}</td><td>${money(x.i.unitPrice)}</td><td>${money(q*x.i.unitPrice)}</td></tr>`}).join("");
let total=revenue([s]), cost=cogs([s]), profit=gross([s]);
let w=window.open("","_blank"); if(!w)return alert("Allow popups to print.");
w.document.write(`<html><head><title>${esc(s.invoice)}</title><style>
body{font-family:Arial,sans-serif;padding:28px;max-width:760px;margin:auto;color:#111}
.header{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:18px}
h1{margin:0}.muted{color:#666}table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left}th{background:#f5f5f5}
.total{margin-left:auto;width:300px;margin-top:20px}.row{display:flex;justify-content:space-between;padding:5px}
.grand{font-size:20px;font-weight:800;border-top:2px solid #111;padding-top:8px}
@media print{body{padding:10px}}
</style></head><body>
<div class="header"><div><h1>Sales God Mode</h1><div class="muted">Retail Sales Invoice</div></div><div><b>${esc(s.invoice)}</b><br>${esc(s.date.slice(0,16).replace("T"," "))}</div></div>
<table><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr>${rows}</table>
<div class="total"><div class="row"><span>Net Sales</span><b>${money(total)}</b></div><div class="row"><span>Payment</span><b>${esc(s.payment)}</b></div><div class="row grand"><span>Total</span><b>${money(total)}</b></div></div>
<p class="muted">Thank you.</p><script>window.print()<\/script></body></html>`);
w.document.close();
}
function exportSalesCSV(){
let rows=[["Invoice","Date","Product","Qty","Unit Price","Cost","Revenue","Profit","Payment"]];
db.sales.forEach(s=>db.saleItems.filter(i=>i.saleId===s.id).forEach(i=>{
let ret=db.returns.filter(r=>r.saleItemId===i.id).reduce((a,r)=>a+Number(r.qty),0),q=Math.max(0,i.qty-ret),rev=q*i.unitPrice,co=q*i.cost;
rows.push([s.invoice,s.date.slice(0,10),productName(i.productId),q,i.unitPrice,i.cost,rev,rev-co,s.payment])
}));
downloadCSV("sales-report-"+todayISO()+".csv",rows)
}

function printSalesReport(){
let rows=filteredSales?filteredSales():db.sales;
let body=rows.map(s=>{let its=db.saleItems.filter(i=>i.saleId===s.id);return `<tr><td>${esc(s.invoice)}</td><td>${esc(s.date.slice(0,10))}</td><td>${its.map(i=>esc(productName(i.productId))+" × "+i.qty).join("<br>")}</td><td>${money(revenue([s]))}</td><td>${money(cogs([s]))}</td><td>${money(gross([s]))}</td></tr>`}).join("");
let w=window.open("","_blank"); if(!w)return alert("Allow popups to print.");
w.document.write(`<html><head><title>Sales Report</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #ddd;text-align:left}h1{margin-bottom:4px}</style></head><body><h1>Sales God Mode</h1><p>Sales Report</p><table><tr><th>Invoice</th><th>Date</th><th>Items</th><th>Sales</th><th>Cost</th><th>Profit</th></tr>${body}</table><script>window.print()<\/script></body></html>`);
w.document.close();
}
function returns(){
return `<h2>Sales Returns</h2>
<div class="card"><form onsubmit="makeReturn(event)">
<div><label>Invoice</label><select id="retSale" required onchange="loadReturnItems()">
<option value="">Select invoice</option>${db.sales.slice().reverse().map(s=>`<option value="${s.id}">${esc(s.invoice)} • ${esc(s.date.slice(0,10))} • ${money(s.total)}</option>`).join("")}</select></div>
<div><label>Product</label><select id="retItem" required><option value="">Select invoice first</option></select></div>
<div><label>Quantity</label><input id="retQty" type="number" min="1" required></div>
<div><label>Reason</label><input id="retReason" placeholder="Customer return"></div>
<div style="align-self:end">${btn("Process Return","this.form.requestSubmit()","primary")}</div>
</form></div>
<div class="section tablewrap"><table><tr><th>Date</th><th>Invoice</th><th>Product</th><th>Qty</th><th>Amount</th><th>Reason</th></tr>
${db.returns.slice().reverse().map(r=>`<tr><td>${esc(r.date.slice(0,16).replace("T"," "))}</td><td>${esc(r.invoice)}</td><td>${esc(productName(r.productId))}</td><td>${r.qty}</td><td>${money(r.amount)}</td><td>${esc(r.reason||"")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">No returns yet.</td></tr>'}</table></div>`;
}
function loadReturnItems(){
let s=db.sales.find(x=>x.id===retSale.value);
retItem.innerHTML=s?db.saleItems.filter(i=>i.saleId===s.id).map(i=>`<option value="${i.id}">${esc(productName(i.productId))} • sold ${i.qty}</option>`).join(""):'<option value="">Select invoice first</option>';
}
function makeReturn(e){
e.preventDefault();
let s=db.sales.find(x=>x.id===retSale.value), item=db.saleItems.find(x=>x.id===retItem.value);
if(!s||!item)return;
let already=db.returns.filter(r=>r.saleItemId===item.id).reduce((a,r)=>a+Number(r.qty),0);
let q=Number(retQty.value);
if(q<1||already+q>Number(item.qty))return alert("Return quantity exceeds the sold quantity.");
let amount=q*Number(item.unitPrice);
let now=new Date().toISOString();
db.returns.push({id:id(),saleId:s.id,saleItemId:item.id,invoice:s.invoice,productId:item.productId,qty:q,amount,reason:retReason.value.trim(),date:now});
db.stock.push({id:id(),productId:item.productId,type:"SALES_RETURN",qty:q,unitCost:Number(item.cost),reason:s.invoice,date:now});
audit("CREATE","RETURN",s.invoice+" / "+productName(item.productId)+" × "+q);save();alert("Return processed.");show("returns");
}
function expenses(){
return `<h2>Expenses</h2>
<div class="card"><form onsubmit="addExpense(event)">
<div><label>Expense name</label><input id="en" required placeholder="Shop rent"></div>
<div><label>Category</label><select id="ec"><option>Rent</option><option>Salary</option><option>Electricity</option><option>Delivery</option><option>Packaging</option><option>Marketing</option><option>Other</option></select></div>
<div><label>Amount</label><input id="ea" type="number" step="0.01" min="0" required></div>
<div><label>Date</label><input id="ed" type="date" value="${todayISO()}" required></div>
<div><label>Note</label><input id="enote"></div>
<div style="align-self:end">${btn("Add Expense","this.form.requestSubmit()","primary")}</div>
</form></div>
<div class="section grid"><div class="card"><div class="muted">Total Expenses</div><div class="metric negative">${money(expensesTotal())}</div></div></div>
<div class="section tablewrap"><table><tr><th>Date</th><th>Expense</th><th>Category</th><th>Amount</th><th>Note</th><th></th></tr>
${db.expenses.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note||"")}</td><td>${btn("Delete",`delExpense('${x.id}')`,"danger")}</td></tr>`).join("")||'<tr><td colspan="6" class="empty">No expenses yet.</td></tr>'}</table></div>`;
}
function addExpense(e){
e.preventDefault();
db.expenses.push({id:id(),name:en.value.trim(),category:ec.value,amount:Number(ea.value),date:ed.value,note:enote.value.trim()});
save();show("expenses");
}
function delExpense(x){db.expenses=db.expenses.filter(e=>e.id!==x);save();show("expenses")}
function reports(){
return `<h2>Reports</h2><div class="toolbar">${btn("Export Inventory CSV","exportInventoryCSV()","primary")}${btn("Export Sales CSV","exportSalesCSV()","primary")}</div>
<div class="card"><form onsubmit="runReport(event)">
<div><label>From</label><input id="rf" type="date"></div>
<div><label>To</label><input id="rt" type="date" value="${todayISO()}"></div>
<div style="align-self:end">${btn("Apply Filter","this.form.requestSubmit()","primary")}</div>
</form></div>
<div id="reportOutput" class="section">${reportHTML()}</div>`;
}
function filteredSales(){
let f=document.getElementById("rf")?.value||"",t=document.getElementById("rt")?.value||todayISO();
return db.sales.filter(s=>{let d=s.date.slice(0,10);return (!f||d>=f)&&(!t||d<=t)});
}
function reportHTML(sales=filteredSales()){
let byBrand=db.brands.map(b=>{let ss=sales.filter(s=>db.saleItems.some(i=>i.saleId===s.id&&db.products.find(p=>p.id===i.productId)?.brandId===b.id));return [b.name,revenue(ss),cogs(ss),gross(ss)]});
let byCat=db.categories.map(c=>{let ss=sales.filter(s=>db.saleItems.some(i=>i.saleId===s.id&&db.products.find(p=>p.id===i.productId)?.categoryId===c.id));return [c.name,revenue(ss),cogs(ss),gross(ss)]});
let top=db.products.map(p=>{let units=db.saleItems.filter(i=>i.productId===p.id&&sales.some(s=>s.id===i.saleId)).reduce((a,i)=>a+Number(i.qty)-db.returns.filter(r=>r.saleItemId===i.id).reduce((z,r)=>z+Number(r.qty),0),0);return [p.name,units]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
return `<div class="grid"><div class="card"><div class="muted">Net Sales</div><div class="metric">${money(revenue(sales))}</div></div><div class="card"><div class="muted">COGS</div><div class="metric">${money(cogs(sales))}</div></div><div class="card"><div class="muted">Gross Profit</div><div class="metric positive">${money(gross(sales))}</div></div><div class="card"><div class="muted">Orders</div><div class="metric">${sales.length}</div></div></div>
<div class="section"><h2>Brand Report</h2><div class="tablewrap"><table><tr><th>Brand</th><th>Sales</th><th>Cost</th><th>Profit</th></tr>${byBrand.map(r=>`<tr><td>${esc(r[0])}</td><td>${money(r[1])}</td><td>${money(r[2])}</td><td class="positive">${money(r[3])}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No data.</td></tr>'}</table></div></div>
<div class="section"><h2>Category Report</h2><div class="tablewrap"><table><tr><th>Category</th><th>Sales</th><th>Cost</th><th>Profit</th></tr>${byCat.map(r=>`<tr><td>${esc(r[0])}</td><td>${money(r[1])}</td><td>${money(r[2])}</td><td class="positive">${money(r[3])}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No data.</td></tr>'}</table></div></div>
<div class="section"><h2>Top Products</h2><div class="tablewrap"><table><tr><th>Product</th><th>Units Sold</th></tr>${top.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join("")||'<tr><td colspan="2" class="empty">No sales.</td></tr>'}</table></div></div>`;
}
function exportInventoryCSV(){
let rows=[["Product","Brand","Category","SKU","Size","Color","Stock","Current Unit Cost","Stock Value"]];
db.products.forEach(p=>rows.push([p.name,brandName(p.brandId),catName(p.categoryId),p.sku,p.size,p.color,stockOf(p.id),productCost(p.id),stockOf(p.id)*productCost(p.id)]));
downloadCSV("inventory-report-"+todayISO()+".csv",rows)
}
function runReport(e){e.preventDefault();document.getElementById("reportOutput").innerHTML=reportHTML(filteredSales())}
function audit(){
return `<h2>Audit Log</h2><div class="tablewrap"><table><tr><th>Date</th><th>Action</th><th>Entity</th><th>Details</th></tr>${db.audit.slice().reverse().map(a=>`<tr><td>${esc(a.date.slice(0,16).replace("T"," "))}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.details)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No audit entries.</td></tr>'}</table></div>`;
}

function settings(){
return `<h2>Settings</h2>
<div class="card"><h3>App Lock</h3>
<p class="muted">Optional 4-8 digit PIN. The lock is local to this device.</p>
<form onsubmit="setPin(event)">
<div><label>New PIN</label><input id="newPin" inputmode="numeric" pattern="\\d{4,8}" maxlength="8" placeholder="4-8 digits"></div>
<div><label>Confirm PIN</label><input id="confirmPin" inputmode="numeric" pattern="\\d{4,8}" maxlength="8"></div>
<div style="align-self:end">${btn(db.settings.pin?"Change PIN":"Set PIN","this.form.requestSubmit()","primary")}</div>
</form>
${db.settings.pin?`<div class="section">${btn("Remove PIN","removePin()","danger")}</div>`:""}
</div>
<div class="card section"><h3>Currency</h3><form onsubmit="setCurrency(event)">
<div><label>Currency symbol</label><input id="currency" maxlength="4" value="${esc(db.settings.currency||"৳")}"></div>
<div style="align-self:end">${btn("Save Currency","this.form.requestSubmit()","primary")}</div>
</form></div>`;
}
function setPin(e){
e.preventDefault();let a=newPin.value.trim(),b=confirmPin.value.trim();
if(!/^\\d{4,8}$/.test(a)||a!==b)return alert("PIN must be 4-8 digits and both fields must match.");
db.settings.pin=a;save();alert("PIN saved.");show("settings");
}
function removePin(){if(!db.settings.pin)return;if(prompt("Enter current PIN to remove it:")!==db.settings.pin)return alert("Incorrect PIN.");delete db.settings.pin;save();show("settings")}
function setCurrency(e){e.preventDefault();db.settings.currency=currency.value.trim()||"৳";save();show("settings")}
function lockScreen(){
if(!db.settings.pin)return false;
document.body.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;background:#111827;color:white;font-family:system-ui"><div style="width:min(360px,90%);background:white;color:#111827;padding:24px;border-radius:18px;text-align:center"><h2>Sales God Mode</h2><p class="muted">Enter PIN to continue</p><input id="unlockPin" type="password" inputmode="numeric" maxlength="8" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px"><button onclick="unlock()" style="margin-top:12px;width:100%;padding:12px;background:#111827;color:white;border:0;border-radius:10px;font-weight:800">Unlock</button></div></div>`;
return true;
}
function unlock(){
if(document.getElementById("unlockPin").value!==db.settings.pin)return alert("Incorrect PIN.");
location.reload();
}
function backup(){
return `<h2>Backup & Restore</h2><div class="card"><p>Everything is stored locally on this device/browser. Export a backup regularly.</p>
<div class="toolbar">${btn("Export Backup","exportBackup()","primary")}<label style="padding:10px 14px;background:#eef2ff;border-radius:9px;cursor:pointer">Import Backup<input type="file" accept=".json" onchange="importBackup(event)" style="display:none"></label>${btn("Clear All Data","clearAll()","danger")}</div>
<p class="muted">Tip: keep a backup before major changes or moving to another device.</p></div>`;
}
function exportBackup(){let backup={version:4,exportedAt:new Date().toISOString(),data:db};let blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sales-god-mode-backup-"+todayISO()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result); x=x.data||x; if(!x.brands||!x.products||!x.sales||!x.stock)throw 0;if(confirm("Replace current data with this backup?")){let old=JSON.stringify(db);let blob=new Blob([old],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pre-restore-backup-"+todayISO()+".json";a.click();db=x;save();show("dashboard")}}catch(_){alert("Invalid backup file.")}};r.readAsText(f)}
function clearAll(){if(confirm("Delete ALL local data? This cannot be undone unless you have a backup.")){db=JSON.parse(JSON.stringify(seed));save();show("dashboard")}}
nav();if(!lockScreen())show("dashboard");
</script>
</body>
</html>
