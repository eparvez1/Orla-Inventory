<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

body{

.section{margin-top:18px}

 gap:10px
}
.full{grid-column:1/-1}
label{

input,select,textarea{

textarea{min-height:90px;resize:vertical}
.primary{

.secondary{

 padding:10px 14px;
 border-radius:9px;
 font-weight:800
}
.danger{
 background:#fee2e2;
 color:#991b1b;
 border:0;
 padding:7px 9px;
 border-radius:8px;
 font-weight:700
}
table{
 width:100%;
 border-collapse:collapse;
 background:#fff
}
th,td{
 padding:9px;
 border-bottom:1px solid #e5e7eb;
 text-align:left;
 font-size:13px
}
th{background:#f9fafb}
.tablewrap{overflow:auto}
.empty{
 padding:30px;
 text-align:center;
 color:#6b7280
}
.toolbar{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 align-items:center;
 margin-bottom:10px
}
.toolbar input{margin:0;flex:1;min-width:200px}
.alert{
 padding:10px;
 border-radius:10px;
 background:#fff7ed;
 color:#9a3412;
 margin-bottom:8px
}
